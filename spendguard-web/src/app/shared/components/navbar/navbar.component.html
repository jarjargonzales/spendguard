<mat-toolbar color="primary" class="navbar">
  <span class="brand">SpendGuard</span>

  <nav class="nav-links">
    <a mat-button routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a mat-button routerLink="/expense-requests" routerLinkActive="active">Solicitudes</a>
    <a mat-button routerLink="/approvals" routerLinkActive="active">Aprobaciones</a>
    <a mat-button routerLink="/reports" routerLinkActive="active">Reportes</a>
  </nav>

  <span class="spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
    {{ username }} ({{ role }})
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  </mat-menu>
</mat-toolbar>
