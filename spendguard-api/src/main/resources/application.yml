server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: spendguard-api
  datasource:
    url: jdbc:postgresql://localhost:5433/spendguard
    username: spendguard
    password: spendguard
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-256-bit-secret}
  access-token-expiration: 900000  # 15 minutes in ms
  refresh-token-expiration: 604800000 # 7 days in ms

logging:
  level:
    com.spendguard: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoint:
    health:
      show-details: always
